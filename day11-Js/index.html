<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    


    <script>
        
        console.log("Hello I am Js From Body")  //Print Output


        //Variable - It is Box In which we store Data , One Data at a Time

        // var - keyword

        // VariableType  VariableName = Data

        var username = "Anushi"

        var email = "abc@gmail.com"

        var height = 5.5

        var height = 100

        console.log(email)
        console.log(height)


        // let - keyword 
        let discount = "10%"

         discount = "5%"

        console.log(discount)


        // const - keyword - Constant - Fixed 

        const appName = "Whatsapp"

       

        console.log(appName)


        //Data Type  - Different Types of Data

        //1. String - "Anything Uder double or single Quotes is String"
        // "Text"

        var country = "India"

        console.log( typeof(country)   )


        //2 Numbers - +ve , -ve , decimal ...
        var temp = -21.45

        console.log(typeof(temp))

        //3. Boolean - true or false

        var isLoggedIn = true

        var NetflixSub = false

        console.log( typeof(isLoggedIn)  )

        console.log( typeof(NetflixSub) )

        //4. Undefined

        var x;
        console.log( typeof(x) )

        //5 . NUll - Nothing
        var b = null

        console.log( typeof(b) )

        // Due To bug in Js - Data Type of Null It shows Object as output


        





    </script>
</body>
</html>
