<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .movie{
            border: 1px solid black;
            padding: 20px;
            width: 400px;
            background-color: #f9f9f9;
            border-radius: 12px;
            box-shadow: 0 4px 8px black;
            margin-top: 12px;
            margin: auto;
        }
    </style>
</head>
<body>
    <h1>Movie Details</h1>

    <input id="movieInput" placeholder="Enter Movie Name">
    <button onclick="HandleSearch()">Search Movie</button>

    <div class="movie" id="movieContainer">

    </div>

    <script>
    
    async function getMovie(movieName) {
        
      let url = `http://www.omdbapi.com/?t=${movieName}&apikey=a6606658`         


       try{
                //Logic
           
        let response =  await    fetch(url)
        let data      =   await        response.json()

        console.log(data)   //All The Movie Details
  
         if(data.Response == "True"){

             const movieContainer = document.getElementById("movieContainer")

             movieContainer.innerHTML = `
             <img src="${data.Poster}">
             <h2>${data.Title}</h2>
             <p>${data.Year}</p>
             <p>${data.Plot}</p>
             

             `


         }else{
            alert('Movie Not Found')
         }



       }catch(error){
            console.log("Error Getting Movie Details " , error)

       }

    }
    
    
    

    function add(){
        console.log(2+2)
    }
    add()


    function HandleSearch(){
        const movieName = document.getElementById("movieInput").value

        if(movieName){

            getMovie(movieName)

        }
    }
    
    
    
    </script>

</body>
</html>
