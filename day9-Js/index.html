<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>
        //Js - Logic  
       console.log(" Hii I am Js ") 

       //Variable - It is Like Box in Which we Store Data

       // 1. var keyword

       var username = "Mehrav"
       console.log(username)

       var password = 1234

       var password = 5678

       console.log(password)


       // 2 let keyword

       let priceofmilk = 50

     //  let priceofmilk = 100 Not Allowed in let

       console.log(priceofmilk)

       let abc = "John"

       abc = "Bob"

       console.log(abc)


       //3 . const keyword - FIXED


       const appName = "WhatsApp"

       console.log(appName)



       //Data Type - Diffrent Types of Data

       //1. String - "Text" or 'Text'

       var email = "abc@gmail.com"

       console.log(  typeof(email)   )


       // Numbers - +ve , -ve , decimal No, whole

       var price = -99.99

       console.log(typeof(price))


       // Boolean - true or false

       var isLogin = false

       var canWatchMovie = true

       console.log( typeof(isLogin) )

       console.log(  typeof(canWatchMovie))


       //undefined - Value is Not Assigned

       var x 
       console.log(  typeof(x) )


       //null 

       var discount = null

       console.log(typeof(discount)  )

       //There is Bug in JS for null - It Give you output as Object

        

    </script>
</body>
</html>
