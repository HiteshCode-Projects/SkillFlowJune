<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .ecom{
            background-color: aqua;
            height: 800px;
          

            display: flex;
            /* flex-direction: column-reverse; */
            justify-content: center;
            gap: 25px;
            align-items: center;
            flex-wrap: wrap;

        }

        .product{
            border: 1px solid black;
            border-radius: 15px;
            padding: 10px;
           
         
            text-align: center;
            height: 300px;
            background-color: beige;
            width: 250px;
            /* box-shadow: X axis y Axis Spread-radius; */
            box-shadow: 2px  2px  6px  black;
        }

         div  p{
            border-bottom: 1px solid black;
        }


        div button{
            background-color: blueviolet;
            padding: 8px;
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            width: 80%;
        }

        div  img{
         
            border-radius: 12px;

            object-fit: cover;
            height: 150px;
            width: 100%;
        }

       
    </style>
</head>
<body>
 
    
<div class="ecom">

    <div class="product">
        <img src="https://images.pexels.com/photos/12920900/pexels-photo-12920900.jpeg">
        <h2>Headhphone</h2>
        <p>Rs 1999.99</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://images.pexels.com/photos/5785893/pexels-photo-5785893.jpeg">
        <h2>Hoodie</h2>
        <p>Rs 599.99</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://images.pexels.com/photos/7880182/pexels-photo-7880182.jpeg">
        <h2>Shoes</h2>
        <p>Rs 3000.00</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://images.pexels.com/photos/5859948/pexels-photo-5859948.jpeg">
        <h2>Cake</h2>
        <p>Rs 250.00</p>
        <button>Buy Now</button>
    </div>
 </div>
   
</body>
</html>
