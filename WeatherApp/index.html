<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
</head>
<body>

    <div class="container">
        <h2>Weather Application</h2>
        <div class="search-section">
            <input type="text" id="location-input" placeholder="Enter The Location">
            <button id="search-button">Search</button>
        </div>

        <div class="output-section">
            <h2>Weather Details</h2>
            <div id="weather-output"></div>
        </div>
    </div>


    <script>
        //Weather API - openweatherapi
        const apiKey = '7baedf95c394f45accbb45ff5053d8092'
        const locationInput = document.getElementById("location-input")
        const searchButton = document.getElementById('search-button')
        const weatherOutput = document.getElementById('weather-output')

        
        searchButton.addEventListener('click', function(){
            let location = locationInput.value;
            if(location){
                fetchWeather(location)
            }else{
                alert('please enter value')
            }
        })





        //APi - Async and await along with fetch()

        async function fetchWeather(location) {
            

            try{
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${location}&appid=7baedf95c394f45accb45ff5053d8092&units=metric`);
               if(!response.ok)  throw new Error('Location not found')

                   
               const weatherData = await response.json()
               console.log(weatherData)

               displayWeather(weatherData)
            }catch(error){
              weatherOutput.innerHTML = `<p>${error.message}</p>`
            }

        }
       
       

        function displayWeather(data){
            const {name , main , weather}  = data;
            weatherOutput.innerHTML = `
            
            <p>Location : ${name}</p>
            <p>Temperature : ${main.temp}</p>
            <p>Weather : ${weather[0].description}</p>
            <p>Humidity ${main.humidity}</p>
            
            
            `
        }

    </script>
</body>
</html>
